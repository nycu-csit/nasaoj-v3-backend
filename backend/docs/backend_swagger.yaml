info:
  contact: {}
  license:
    name: 0BSD
  title: NASAOJ v3
  version: "3.0"
paths:
  /api/admin/content-files:
    put:
      consumes:
      - application/json
      description: Uploads SHA1-addressed content files used by problems and tools.
        Admin only.
      parameters:
      - description: content files
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/api.PutContentFilesInput'
          type: array
      responses:
        "200":
          description: success
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Upload content files
  /api/admin/dump-scores/{problemId}:
    get:
      description: Returns every user's score for a problem, honoring the deadline.
        Admin only.
      parameters:
      - description: problem id
        format: int64
        in: path
        name: problemId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: scores
          schema:
            items:
              $ref: '#/definitions/models.UserScore'
            type: array
      summary: Dump scores for a problem
  /api/admin/namespace:
    post:
      consumes:
      - application/json
      description: Creates a namespace. Global admin only.
      parameters:
      - description: namespace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PostNamespaceInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Namespace'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Create a namespace
  /api/admin/namespace/state:
    put:
      consumes:
      - application/json
      description: Toggles a namespace's enabled state. Global admin only.
      parameters:
      - description: state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutNamespaceStateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Enable or disable a namespace
  /api/admin/namespace/users:
    delete:
      consumes:
      - application/json
      description: |-
        Removes users from the namespace in the X-Namespace header.
        Global admin or admin of that namespace.
      parameters:
      - description: namespace name or id
        in: header
        name: X-Namespace
        required: true
        type: string
      - description: members
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.DeleteNamespaceUsersInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      summary: Remove namespace members
    get:
      description: |-
        Lists members of the namespace from the X-Namespace header.
        Global admin or admin of that namespace.
      parameters:
      - description: namespace name or id
        in: header
        name: X-Namespace
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserNamespace'
            type: array
        "403":
          description: Forbidden
          schema:
            type: string
      summary: List namespace members
    put:
      consumes:
      - application/json
      description: |-
        Adds (or updates the admin flag of) users in the namespace
        from the X-Namespace header. Global admin or admin of that
        namespace.
      parameters:
      - description: namespace name or id
        in: header
        name: X-Namespace
        required: true
        type: string
      - description: members
        in: body
        name: request
        required: true
        schema:
