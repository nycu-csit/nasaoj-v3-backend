basePath: /
definitions:
  api.AdminSubmitInput:
    properties:
      asOwnerId:
        type: integer
      inputArgs:
        additionalProperties:
          type: string
        type: object
      refSHA1:
        description: Submit problem ID
        type: string
      type:
