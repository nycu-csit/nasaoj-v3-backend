        type: object
      name:
        type: string
      title:
        type: string
    type: object
  api.PostTokenInput:
    properties:
      description:
        description: |-
          Description is required: it's how `judge admin get tokens` tells
          tokens apart without decoding the secret itself.
        type: string
      tokenType:
        type: string
      userId:
        description: |-
          UserId is required when TokenType is "user": the token's privileges
          and namespace membership are resolved live from this user on every
          request.
        type: integer
    type: object
  api.PostTokenOutput:
    properties:
      token:
        type: string
    type: object
  api.ProblemOutput:
