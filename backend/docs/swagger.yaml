basePath: /
definitions:
  api.AdminSubmitInput:
    properties:
      asOwnerId:
        type: integer
      inputArgs:
        additionalProperties:
          type: string
        type: object
      refSHA1:
        description: Submit problem ID
        type: string
      type:
        type: integer
    type: object
  api.GetTokensOutput:
    properties:
      createdAt:
        type: integer
      isEnabled:
        type: boolean
      privs:
        $ref: '#/definitions/models.Privileges'
      sha256:
        type: string
    type: object
  api.GetWorkerStatesOutput:
    properties:
      ip:
        type: string
      jobs:
        items:
          type: string
        type: array
      lastAccess:
        type: integer
      name:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  api.MeOutput:
    properties:
      accessToken:
        $ref: '#/definitions/models.AccessTokenClaim'
      isAdmin:
        type: boolean
    type: object
  api.PostTokenInput:
    properties:
      tokenType:
        type: string
    type: object
  api.PostTokenOutput:
    properties:
      token:
        type: string
    type: object
  api.ProblemOutput:
    properties:
      deadline:
        type: integer
      description:
        type: string
      importedAt:
        type: integer
      isEnabled:
        type: boolean
      name:
        type: string
      problemId:
        type: integer
      scoreType:
        $ref: '#/definitions/models.ScoreTypeType'
      sha1:
        type: string
      spec:
        $ref: '#/definitions/api.ProblemOutputSpec'
      stages:
        additionalProperties:
          $ref: '#/definitions/api.problemOutputStage'
        type: object
      tag:
        type: string
      totalScore:
        type: integer
    type: object
  api.ProblemOutputSpec:
    properties:
      link:
        type: string
      type:
        type: string
    type: object
  api.PutCancelSubmissionInput:
    properties:
      subId:
        type: integer
    type: object
  api.PutContentFilesInput:
    properties:
      isTemplate:
        type: boolean
      name:
        type: string
      payload:
        type: string
      sha1:
        type: string
    type: object
  api.PutProblemStateInput:
    properties:
      isEnabled:
        type: boolean
      problemSHA1:
        type: string
    type: object
  api.PutProblemsInputProblem:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      cooldown:
        type: integer
      deadline:
        type: integer
      description:
        type: string
      name:
        type: string
      postScript:
        $ref: '#/definitions/models.Content'
      preScript:
        $ref: '#/definitions/models.Content'
      problemId:
        type: integer
      scoreType:
        $ref: '#/definitions/models.ScoreTypeType'
      spec:
        $ref: '#/definitions/models.ProblemSpec'
      stages:
        additionalProperties:
          $ref: '#/definitions/models.Stage'
        type: object
      tag:
        type: string
    type: object
  api.PutProblemsOutputProblem:
    properties:
      name:
        type: string
      problemId:
        type: integer
      sha1:
        type: string
    type: object
  api.PutTokenStateInput:
    properties:
      state:
        type: boolean
      token:
        type: string
    type: object
  api.PutToolStateInput:
    properties:
      isEnabled:
        type: boolean
      toolSHA1:
        type: string
    type: object
  api.PutToolsInputTool:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      cooldown:
        type: integer
      description:
        type: string
      inputArgs:
        items:
          $ref: '#/definitions/models.ToolInputArg'
        type: array
      name:
        type: string
      postScript:
        $ref: '#/definitions/models.Content'
      preScript:
        $ref: '#/definitions/models.Content'
      tag:
        type: string
      testcase:
        $ref: '#/definitions/models.Testcase'
      toolId:
        type: integer
    type: object
  api.PutToolsOutputTool:
    properties:
      name:
        type: string
      sha1:
        type: string
      toolId:
        type: integer
    type: object
  api.PutUsersCSSSOInput:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      csId:
        type: string
    type: object
  api.PutUsersPlainInput:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      password:
        type: string
      username:
        type: string
    type: object
  api.ResultOutput:
    properties:
      createdAt:
        type: integer
      id:
        type: integer
      inputArgs:
        additionalProperties:
          type: string
        type: object
      jobs:
        items:
          $ref: '#/definitions/api.ResultOutputJob'
        type: array
      ownerId:
        type: integer
      refId:
        type: integer
      refSHA1:
        type: string
      score:
        type: integer
      totalScore:
        type: integer
      type:
        $ref: '#/definitions/models.RefType'
      username:
        type: string
    type: object
  api.ResultOutputJob:
    properties:
      execAt:
        type: integer
      retCode:
        type: integer
      stageName:
        type: string
      status:
        $ref: '#/definitions/models.JobStatus'
      testName:
        type: string
    type: object
  api.ScoreRequest:
    properties:
      score:
        type: integer
      subId:
        type: integer
    type: object
  api.SubmissionsOutput:
    properties:
      pageSize:
        type: integer
      submissions:
        items:
          $ref: '#/definitions/api.SubmissionsOutputSubmission'
        type: array
      totalRowCnt:
        type: integer
    type: object
  api.SubmissionsOutputSubmission:
    properties:
      createdAt:
        type: integer
      id:
        type: integer
      ownerId:
        type: integer
      refId:
        type: integer
      refSHA1:
        type: string
      score:
        type: integer
      totalScore:
        type: integer
      type:
        $ref: '#/definitions/models.RefType'
      username:
        type: string
    type: object
  api.SubmitInput:
    properties:
      inputArgs:
        additionalProperties:
          type: string
        type: object
      refSHA1:
        description: Submit problem ID
        type: string
      type:
        type: integer
    type: object
  api.SubmitOutput:
    properties:
      createdAt:
        type: integer
      id:
        type: integer
      inputArgs:
        additionalProperties:
          type: string
        type: object
      ownerId:
        type: integer
      refId:
        type: integer
      refSHA1:
        type: string
    type: object
  api.SubmitTimeoutOutput:
    properties:
      code:
        type: integer
      message:
        type: string
      retryAfter:
        type: integer
      traceId:
        type: string
    type: object
  api.ToolOutput:
    properties:
      description:
        type: string
      importedAt:
        type: integer
      inputArgs:
        items:
          $ref: '#/definitions/models.ToolInputArg'
        type: array
      isEnabled:
        type: boolean
      name:
        type: string
      sha1:
        type: string
      tag:
        type: string
      testcase:
        $ref: '#/definitions/api.toolOutputTestcase'
      toolId:
        type: integer
    type: object
  api.problemOutputStage:
    properties:
      before:
        items:
          type: string
        type: array
      score:
        type: integer
      testcases:
        items:
          $ref: '#/definitions/api.problemOutputStageTestcase'
        type: array
    type: object
  api.problemOutputStageTestcase:
    properties:
      name:
        type: string
    type: object
  api.toolOutputTestcase:
    properties:
      name:
        type: string
    type: object
  auth.LoginPlainInput:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  jwt.NumericDate:
    properties:
      time.Time:
        type: string
    type: object
  models.AccessTokenClaim:
    properties:
      aud:
        description: the `aud` (Audience) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
        items:
          type: string
        type: array
      exp:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `exp` (Expiration Time) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.4
      iat:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `iat` (Issued At) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.6
      iss:
        description: the `iss` (Issuer) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
        type: string
      jti:
        description: the `jti` (JWT ID) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.7
        type: string
      nbf:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `nbf` (Not Before) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.5
      privs:
        $ref: '#/definitions/models.Privileges'
      resource:
        $ref: '#/definitions/models.UserResource'
      sub:
        description: the `sub` (Subject) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.2
        type: string
    type: object
  models.Content:
    properties:
      files:
        items:
          $ref: '#/definitions/models.ContentFile'
        type: array
      scripts:
        items:
          type: string
        type: array
    type: object
  models.ContentFile:
    properties:
      isTemplate:
        type: boolean
      name:
        type: string
      payload:
        type: string
      sha1:
        type: string
    type: object
  models.JobStatus:
    enum:
    - 260
    - 261
    - 262
    - 263
    - 460
    - 461
    - 462
    - 463
    - 560
    format: int64
    type: integer
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusSuccess
    - StatusBlocked
    - StatusFailed
    - StatusSkipped
    - StatusTimeout
    - StatusCancelled
    - StatusMissing
  models.LoginSourceType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - LoginSourcePlain
    - LoginSourceCSSSO
  models.Privileges:
    properties:
      canAPIRead:
        type: integer
      canAPIWrite:
        type: integer
      canScheduleAPI:
        type: integer
      canUserArgsWrite:
        type: integer
      ownerId:
        type: integer
    type: object
  models.ProblemSpec:
    properties:
      link:
        type: string
      type:
        type: string
    type: object
  models.RefType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - RefTypeProblem
    - RefTypeTool
  models.ScoreTypeType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - ScoreTypeDefault
    - ScoreTypeSelfManaged
  models.Stage:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      before:
        items:
          type: string
        type: array
      postScript:
        $ref: '#/definitions/models.Content'
      preScript:
        $ref: '#/definitions/models.Content'
      score:
        type: integer
      testcases:
        items:
          $ref: '#/definitions/models.Testcase'
        type: array
    type: object
  models.Testcase:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      files:
        items:
          $ref: '#/definitions/models.ContentFile'
        type: array
      image:
        type: string
      name:
        type: string
      resourceGroup:
        type: string
      scripts:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  models.ToolInputArg:
    properties:
      name:
        type: string
      type:
        $ref: '#/definitions/types.ToolInputTypeType'
    type: object
  models.UserResource:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      isAdmin:
        type: boolean
      source:
        $ref: '#/definitions/models.LoginSourceType'
      sourceId:
        type: string
      username:
        type: string
    type: object
  models.UserScore:
    properties:
      createdAt:
        type: integer
      id:
        type: integer
      score:
        type: integer
      username:
        type: string
    type: object
  models.UserScoreWithStages:
    properties:
      createdAt:
        type: integer
      id:
        type: integer
      score:
        type: integer
      stages:
        additionalProperties:
          format: int64
          type: integer
        type: object
      username:
        type: string
    type: object
  types.ToolInputTypeType:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - ToolInputTypeString
    - ToolInputTypeNumeric
    - ToolInputTypeBoolean
info:
  contact: {}
  license:
    name: 0BSD
  termsOfService: http://swagger.io/terms/
  title: NASAOJ v3
  version: "3.0"
paths:
  /api/admin/content-files:
    put:
      consumes:
      - application/json
      parameters:
      - description: content files
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/api.PutContentFilesInput'
          type: array
      responses:
        "200":
          description: success
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/dump-scores/{problemId}:
    get:
      parameters:
      - description: problem id
        format: int64
        in: path
        name: problemId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: scores
          schema:
            items:
              $ref: '#/definitions/models.UserScore'
            type: array
  /api/admin/problem:
    delete:
      parameters:
      - description: Problem SHA1
        in: query
        name: problemSHA1
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/problem/state:
    put:
      consumes:
      - application/json
      parameters:
      - description: problem state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutProblemStateInput'
      responses:
        "200":
          description: success
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/problems:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ProblemOutput'
            type: array
        "500":
          description: Problem loading error
          schema:
            type: string
    put:
      consumes:
      - application/json
      parameters:
      - description: problems
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/api.PutProblemsInputProblem'
          type: array
      responses:
        "200":
          description: problems
          schema:
            items:
              $ref: '#/definitions/api.PutProblemsOutputProblem'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/results:
    get:
      parameters:
      - description: Submission Id
        in: query
        name: subId
        required: true
        type: integer
      responses:
        "200":
          description: Submission
          schema:
            $ref: '#/definitions/api.ResultOutput'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
  /api/admin/scores:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Scores
          schema:
            items:
              $ref: '#/definitions/models.UserScoreWithStages'
            type: array
        "400":
          description: Invalid problem id
          schema:
            type: string
  /api/admin/stderr:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stderr
          schema:
            type: string
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /api/admin/stdout:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stdout
          schema:
            type: string
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /api/admin/submission:
    delete:
      parameters:
      - description: Submission Id
        format: int64
        in: query
        name: subId
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/submission/cancel:
    put:
      parameters:
      - description: query body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutCancelSubmissionInput'
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/submissions:
    get:
      parameters:
      - default: 0
        description: Page number, one page is 20 submissions
        format: int64
        in: query
        name: pageNum
        type: integer
      - description: Filter by OwnerId
        format: int64
        in: query
        name: ownerId
        type: integer
      - description: Filter by RefId
        format: int64
        in: query
        name: refId
        type: integer
      - description: Filter by Type
        in: query
        name: type
        type: integer
      responses:
        "200":
          description: Submissions
          schema:
            $ref: '#/definitions/api.SubmissionsOutput'
        "400":
          description: Problem Id invalid
          schema:
            type: string
        "401":
          description: not admin or didn't login
          schema:
            type: string
  /api/admin/submit:
    post:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdminSubmitInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SubmitOutput'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
  /api/admin/token:
    post:
      consumes:
      - application/json
      parameters:
      - description: token type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PostTokenInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PostTokenOutput'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/token/state:
    put:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutTokenStateInput'
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.GetTokensOutput'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/tool:
    delete:
      parameters:
      - description: Tool SHA1
        in: query
        name: toolSHA1
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/tool/state:
    put:
      consumes:
      - application/json
      parameters:
      - description: tool state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutToolStateInput'
      responses:
        "200":
          description: success
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/tools:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ToolOutput'
            type: array
        "401":
          description: Unauthorized
    put:
      consumes:
      - application/json
      parameters:
      - description: tools
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/api.PutToolsInputTool'
          type: array
      responses:
        "200":
          description: tools
          schema:
            items:
              $ref: '#/definitions/api.PutToolsOutputTool'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/user:
    delete:
      parameters:
      - description: User Id
        in: query
        name: id
        required: true
        type: string
      - description: If delete submissions
        in: query
        name: prune
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
    get:
      parameters:
      - description: User Id to be queried
        format: int64
        in: query
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: not admin or not login
          schema:
            type: string
  /api/admin/users:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserResource'
            type: array
        "401":
          description: not admin or not login
          schema:
            type: string
  /api/admin/users/cssso:
    put:
      consumes:
      - application/json
      parameters:
      - description: request body
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/api.PutUsersCSSSOInput'
          type: array
      responses:
        "200":
