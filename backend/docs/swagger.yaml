basePath: /
definitions:
  api.MeOutput:
    properties:
      accessToken:
        $ref: '#/definitions/models.AccessTokenClaim'
      isAdmin:
        type: boolean
    type: object
  api.PostTokenInput:
    properties:
      tokenType:
        type: string
    type: object
  api.PostTokenOutput:
    properties:
      token:
        type: string
    type: object
  api.PutProblemStateInput:
    properties:
      isEnabled:
        type: boolean
      problemSHA1:
        type: string
    type: object
  api.adminSubmitInput:
    properties:
      asCsId:
        type: string
      problemSHA1:
        description: Submit problem ID
        type: string
    type: object
  api.problemOutput:
    properties:
      description:
        type: string
      importedAt:
        type: integer
      isEnabled:
        type: boolean
      name:
        type: string
      problemId:
        type: integer
      sha1:
        type: string
      stages:
        additionalProperties:
          $ref: '#/definitions/api.problemOutputStage'
        type: object
      tag:
        type: string
    type: object
  api.problemOutputStage:
    properties:
      before:
        items:
          type: string
        type: array
      score:
        type: integer
      testcases:
        items:
          $ref: '#/definitions/api.problemOutputStageTestcase'
        type: array
    type: object
  api.problemOutputStageTestcase:
    properties:
      name:
        type: string
    type: object
  api.resultOutput:
    properties:
      csId:
        type: string
      id:
        type: integer
      jobs:
        items:
          $ref: '#/definitions/api.resultOutputJob'
        type: array
      problemId:
        type: integer
      problemName:
        type: string
      problemSHA1:
        type: string
      score:
        type: integer
      submitAt:
        type: integer
    type: object
  api.resultOutputJob:
    properties:
      execAt:
        type: integer
      retCode:
        type: integer
      stageName:
        type: string
      status:
        $ref: '#/definitions/models.JobStatus'
      testName:
        type: string
    type: object
  api.submissionsOutput:
    properties:
      pageSize:
        type: integer
      submissions:
        items:
          $ref: '#/definitions/api.submissionsOutputSubmission'
        type: array
      totalRowCnt:
        type: integer
    type: object
  api.submissionsOutputSubmission:
    properties:
      csId:
        type: string
      id:
        type: integer
      problemId:
        type: integer
      problemName:
        type: string
      problemSHA1:
        type: string
      score:
        type: integer
      submitAt:
        type: integer
    type: object
  api.submitInput:
    properties:
      problemSHA1:
        description: Submit problem ID
        type: string
    type: object
  api.submitOutput:
    properties:
      csId:
        type: string
      id:
        type: integer
      problemId:
        type: integer
      problemName:
        type: string
      problemSHA1:
        type: string
      submitAt:
        type: integer
    type: object
  jwt.NumericDate:
    properties:
      time.Time:
        type: string
    type: object
  models.AccessTokenClaim:
    properties:
      aud:
        description: the `aud` (Audience) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
        items:
          type: string
        type: array
      csId:
        type: string
      exp:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `exp` (Expiration Time) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.4
      groups:
        items:
          type: string
        type: array
      iat:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `iat` (Issued At) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.6
      iss:
        description: the `iss` (Issuer) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
        type: string
      jti:
        description: the `jti` (JWT ID) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.7
        type: string
      nbf:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `nbf` (Not Before) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.5
      privs:
        $ref: '#/definitions/models.Privileges'
      resource:
        $ref: '#/definitions/models.UserResource'
      sub:
        description: the `sub` (Subject) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.2
        type: string
    type: object
  models.Content:
    properties:
      files:
        items:
          $ref: '#/definitions/models.ContentFile'
        type: array
      scripts:
        items:
          type: string
        type: array
    type: object
  models.ContentFile:
    properties:
      name:
        type: string
      sha1:
        type: string
    type: object
  models.JobStatus:
    enum:
    - 263
    - 260
    - 261
    - 262
    - 460
    - 461
    - 462
    - 560
    type: integer
    x-enum-varnames:
    - StatusBlocked
    - StatusPending
    - StatusRunning
    - StatusSuccess
    - StatusFailed
    - StatusSkip
    - StatusTimeout
    - StatusMissing
  models.Privileges:
    properties:
      canAPIRead:
        type: integer
      canAPIWrite:
        type: integer
      canScheduleAPI:
        type: integer
      ownerCsId:
        type: string
    type: object
  models.Problem:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      description:
        type: string
      importedAt:
        type: integer
      isTool:
        type: boolean
      name:
        type: string
      postScript:
        $ref: '#/definitions/models.Content'
      preScript:
        $ref: '#/definitions/models.Content'
      problemId:
        type: integer
      stages:
        additionalProperties:
          $ref: '#/definitions/models.Stage'
        type: object
      tag:
        type: string
      timeout:
        type: integer
    type: object
  models.Stage:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      before:
        items:
          type: string
        type: array
      postScript:
        $ref: '#/definitions/models.Content'
      preScript:
        $ref: '#/definitions/models.Content'
      score:
        type: integer
      testcases:
        items:
          $ref: '#/definitions/models.Testcase'
        type: array
    type: object
  models.Testcase:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      files:
        items:
          $ref: '#/definitions/models.ContentFile'
        type: array
      hardTL:
        type: integer
      name:
        type: string
      scripts:
        items:
          type: string
        type: array
      softTL:
        type: integer
    type: object
  models.Token:
    properties:
      privs:
        $ref: '#/definitions/models.Privileges'
      sha256:
        type: string
    type: object
  models.UserResource:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      csId:
        type: string
    type: object
  models.UserScore:
    properties:
      csId:
        type: string
      score:
        type: integer
    type: object
  models.UserScoreWithStages:
    properties:
      csId:
        type: string
      score:
        type: integer
      stages:
        additionalProperties:
          type: integer
        type: object
    type: object
info:
  contact: {}
  license:
    name: WTFPL
  termsOfService: http://swagger.io/terms/
  title: NASAOJ v3
  version: "2.0"
paths:
  /api/admin/problem-state:
    put:
      consumes:
      - application/json
      parameters:
      - description: problem state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutProblemStateInput'
      responses:
        "200":
          description: success
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/problems:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.problemOutput'
            type: array
        "500":
          description: Problem loading error
          schema:
            type: string
    put:
      consumes:
      - application/json
      parameters:
      - description: problem
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            $ref: '#/definitions/models.Problem'
          type: object
      responses:
        "200":
          description: success
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/results:
    get:
      parameters:
      - description: Submission Id
        in: query
        name: subId
        required: true
        type: integer
      responses:
        "200":
          description: Submission
          schema:
            $ref: '#/definitions/api.resultOutput'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
  /api/admin/scores:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Scores
          schema:
            items:
              $ref: '#/definitions/models.UserScoreWithStages'
            type: array
        "400":
          description: Invalid problem id
          schema:
            type: string
  /api/admin/stderr:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stderr
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
  /api/admin/stdout:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stdout
          schema:
            type: string
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /api/admin/submissions:
    get:
      parameters:
      - default: 0
        description: Page number, one page is 20 submissions
        in: query
        name: pageNum
        type: integer
      - description: Filter by CsId
        in: query
        name: csId
        type: string
      - description: Filter by Problem Id
        in: query
        name: problemId
        type: integer
      responses:
        "200":
          description: Submissions
          schema:
            $ref: '#/definitions/api.submissionsOutput'
        "400":
          description: Problem Id invalid
          schema:
            type: string
        "401":
          description: not admin or didn't login
          schema:
            type: string
  /api/admin/submit:
    post:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.adminSubmitInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.submitOutput'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "429":
          description: Too Many Requests
  /api/admin/token:
    delete:
      parameters:
      - description: Token
        in: query
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
    post:
      consumes:
      - application/json
      parameters:
      - description: token type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PostTokenInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PostTokenOutput'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Token'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/admin/tools:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.problemOutput'
            type: array
        "500":
          description: Tool loading error
          schema:
            type: string
  /api/admin/user:
    get:
      parameters:
      - description: User CsId to by queried
        in: query
        name: csId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: not admin or not login
          schema:
            type: string
  /api/admin/users:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserResource'
            type: array
        "401":
          description: not admin or not login
          schema:
            type: string
    put:
      consumes:
      - application/json
      parameters:
      - description: User resources
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/models.UserResource'
          type: array
      responses:
        "200":
          description: success
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
  /api/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MeOutput'
        "401":
          description: missing credential
          schema:
            type: string
  /api/problem:
    get:
      parameters:
      - description: problem sha1
        in: query
        name: problemSHA1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.problemOutput'
        "500":
          description: Problem loading failed
          schema:
            type: string
  /api/problems:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.problemOutput'
            type: array
        "500":
          description: Problem loading error
          schema:
            type: string
  /api/results:
    get:
      parameters:
      - description: Problem Id
        in: query
        name: problemId
        type: integer
      - description: Submission Id
        in: query
        name: subId
        type: integer
      responses:
        "200":
          description: Last submission to the problem
          schema:
            $ref: '#/definitions/api.resultOutput'
        "400":
          description: Problem ID invalid
          schema:
            type: string
        "401":
          description: Access token missing
          schema:
            type: string
        "404":
          description: No submission
          schema:
            type: string
  /api/scores:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Scores
          schema:
            items:
              $ref: '#/definitions/models.UserScore'
            type: array
        "400":
          description: Invalid problem id
          schema:
            type: string
  /api/stdout:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stdout
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
  /api/submissions:
    get:
      parameters:
      - default: 0
        description: Page number, one page is 20 submissions
        in: query
        name: pageNum
        type: integer
      - description: Filter by Problem Id
        in: query
        name: problemId
        type: integer
      responses:
        "200":
          description: Submissions
          schema:
            $ref: '#/definitions/api.submissionsOutput'
        "400":
          description: Problem Id invalid
          schema:
            type: string
        "401":
          description: didn't login
          schema:
            type: string
  /api/submit:
    post:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.submitInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.submitOutput'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
  /api/tool:
    get:
      parameters:
      - description: problem sha1
        in: query
        name: problemSHA1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.problemOutput'
        "500":
          description: Problem loading failed
          schema:
            type: string
  /api/tools:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.problemOutput'
            type: array
        "500":
          description: Tool loading error
          schema:
            type: string
  /auth/callback:
    get:
      description: Oauth callback endpoint
      parameters:
      - description: Login source
        in: query
        name: source
        type: string
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
  /auth/login:
    get:
      description: OAuth login endpoint
      parameters:
      - description: Login source
        in: query
        name: source
        type: string
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
  /auth/logout:
    put:
      description: Logout endpoint
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
swagger: "2.0"
