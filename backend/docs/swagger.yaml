basePath: /
definitions:
  handlers.MeOutput:
    properties:
      isAdmin:
        type: boolean
      jwtClaim:
        $ref: '#/definitions/models.JWTClaim'
      resource:
        $ref: '#/definitions/models.UserResource'
    type: object
  handlers.ScoreOutput:
    properties:
      csId:
        type: string
      score:
        type: integer
      stages:
        additionalProperties:
          type: integer
        type: object
    type: object
  handlers.adminSubmitInput:
    properties:
      asCsId:
        type: string
      problemId:
        description: Submit problem ID
        type: integer
    type: object
  handlers.problemOutput:
    properties:
      name:
        type: string
      problemId:
        type: integer
      stages:
        additionalProperties:
          $ref: '#/definitions/handlers.problemOutputStage'
        type: object
      tag:
        type: string
    type: object
  handlers.problemOutputStage:
    properties:
      before:
        items:
          type: string
        type: array
      score:
        type: integer
      testcases:
        items:
          $ref: '#/definitions/handlers.problemOutputStageTestcase'
        type: array
    type: object
  handlers.problemOutputStageTestcase:
    properties:
      name:
        type: string
    type: object
  handlers.resultOutput:
    properties:
      csId:
        type: string
      id:
        type: integer
      jobs:
        items:
          $ref: '#/definitions/handlers.resultOutputJob'
        type: array
      problemId:
        type: integer
      problemName:
        type: string
      score:
        type: integer
      submitAt:
        type: integer
    type: object
  handlers.resultOutputJob:
    properties:
      execAt:
        type: integer
      retCode:
        type: integer
      stageName:
        type: string
      status:
        $ref: '#/definitions/models.JobStatus'
      testName:
        type: string
    type: object
  handlers.submissionsOutput:
    properties:
      pageSize:
        type: integer
      submissions:
        items:
          $ref: '#/definitions/handlers.submissionsOutputSubmission'
        type: array
      totalRowCnt:
        type: integer
    type: object
  handlers.submissionsOutputSubmission:
    properties:
      csId:
        type: string
      id:
        type: integer
      problemId:
        type: integer
      problemName:
        type: string
      score:
        type: integer
      submitAt:
        type: integer
    type: object
  handlers.submitInput:
    properties:
      problemId:
        description: Submit problem ID
        type: integer
    type: object
  handlers.submitOutput:
    properties:
      csId:
        type: string
      id:
        type: integer
      problemId:
        type: integer
      problemName:
        type: string
      submitAt:
        type: integer
    type: object
  jwt.NumericDate:
    properties:
      time.Time:
        type: string
    type: object
  models.JWTClaim:
    properties:
      aud:
        description: the `aud` (Audience) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
        items:
          type: string
        type: array
      csId:
        type: string
      exp:
        type: integer
      groups:
        items:
          type: string
        type: array
      iat:
        type: integer
      iss:
        description: the `iss` (Issuer) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
        type: string
      jti:
        description: the `jti` (JWT ID) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.7
        type: string
      nbf:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `nbf` (Not Before) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.5
      sub:
        description: the `sub` (Subject) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.2
        type: string
    type: object
  models.JobStatus:
    enum:
    - 260
    - 261
    - 262
    - 460
    - 461
    - 560
    type: integer
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusSuccess
    - StatusFailed
    - StatusSkip
    - StatusMissing
  models.UserResource:
    properties:
      csId:
        type: string
      id:
        type: integer
      roomId:
        type: string
    type: object
info:
  contact: {}
  license:
    name: WTFPL
  termsOfService: http://swagger.io/terms/
  title: NASAOJ v3
  version: "2.0"
paths:
  /api/admin/reloadscores:
    post:
      responses:
        "200":
          description: Success
          schema:
            type: string
        "401":
          description: Unauthorized
  /api/admin/results:
    get:
      parameters:
      - description: Submission Id
        in: query
        name: subId
        required: true
        type: integer
      responses:
        "200":
          description: Submission
          schema:
            $ref: '#/definitions/handlers.resultOutput'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
  /api/admin/scores:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Scores
          schema:
            items:
              $ref: '#/definitions/handlers.ScoreOutput'
            type: array
        "400":
          description: Invalid problem id
          schema:
            type: string
  /api/admin/stderr:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stderr
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
  /api/admin/stdout:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stdout
          schema:
            type: string
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /api/admin/submissions:
    get:
      parameters:
      - default: 0
        description: Page number, one page is 20 submissions
        in: query
        name: pageNum
        type: integer
      - description: Filter by CsId
        in: query
        name: csId
        type: string
      - description: Filter by Problem Id
        in: query
        name: problemId
        type: integer
      responses:
        "200":
          description: Submissions
          schema:
            $ref: '#/definitions/handlers.submissionsOutput'
        "400":
          description: Problem Id invalid
          schema:
            type: string
        "401":
          description: not admin or didn't login
          schema:
            type: string
  /api/admin/submit:
    put:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.adminSubmitInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.submitOutput'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "429":
          description: Too Many Requests
  /api/admin/users:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserResource'
            type: array
        "401":
          description: not admin or not login
          schema:
            type: string
  /api/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeOutput'
        "401":
          description: missing credential
          schema:
            type: string
  /api/problems:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.problemOutput'
            type: array
        "500":
          description: Problem loading error
          schema:
            type: string
  /api/results:
    get:
      parameters:
      - description: Problem Id
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Last submission to the problem
          schema:
            $ref: '#/definitions/handlers.resultOutput'
        "400":
          description: Problem ID invalid
          schema:
            type: string
        "401":
          description: User resource missing
          schema:
            type: string
        "404":
          description: No submission
          schema:
            type: string
  /api/scores:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Scores
          schema:
            items:
              $ref: '#/definitions/handlers.ScoreOutput'
            type: array
        "400":
          description: Invalid problem id
          schema:
            type: string
  /api/stdout:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result stdout
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
  /api/submissions:
    get:
      parameters:
      - default: 0
        description: Page number, one page is 20 submissions
        in: query
        name: pageNum
        type: integer
      - description: Filter by Problem Id
        in: query
        name: problemId
        type: integer
      responses:
        "200":
          description: Submissions
          schema:
            $ref: '#/definitions/handlers.submissionsOutput'
        "400":
          description: Problem Id invalid
          schema:
            type: string
        "401":
          description: didn't login
          schema:
            type: string
  /api/submit:
    put:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.submitInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.submitOutput'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
  /auth/callback:
    get:
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
  /auth/login:
    get:
      description: OAuth login endpoint
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
securityDefinitions:
  ApiKeyAuth:
    description: jwt=value, get it at /auth/login
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
