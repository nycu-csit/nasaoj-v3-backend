basePath: /
definitions:
  handlers.GetScoresPayload:
    properties:
      csid:
        type: string
      score:
        type: number
    type: object
  models.Job:
    properties:
      eat:
        description: Executed time
        type: integer
      output:
        type: string
      retcode:
        type: integer
      stagename:
        type: string
      subid:
        type: integer
      testcontent:
        type: string
      testname:
        type: string
    type: object
  models.Problem:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      stages:
        additionalProperties:
          $ref: '#/definitions/models.Stage'
        type: object
    type: object
  models.Stage:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      before:
        items:
          type: string
        type: array
      testcases:
        items:
          $ref: '#/definitions/models.Testcase'
        type: array
    type: object
  models.Submission:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      csid:
        type: string
      id:
        type: integer
      jobs:
        items:
          $ref: '#/definitions/models.Job'
        type: array
      problemname:
        type: string
      sat:
        description: Submit time
        type: integer
    type: object
  models.Testcase:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      file:
        type: string
      name:
        type: string
      weight:
        type: integer
    type: object
info:
  contact: {}
  license:
    name: WTFPL
  termsOfService: http://swagger.io/terms/
  title: NASAOJ v3
  version: "2.0"
paths:
  /api/output:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result output
          schema:
            type: string
  /api/problems:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Problem'
            type: array
      security:
      - ApiKeyAuth: []
  /api/results:
    get:
      parameters:
      - description: Problem name
        in: query
        name: problem
        required: true
        type: string
      responses:
        "200":
          description: Last submission to the problem
          schema:
            $ref: '#/definitions/models.Submission'
  /api/scores:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GetScoresPayload'
  /api/submit:
    put:
      consumes:
      - text/plain
      parameters:
      - description: Submit problem name
        in: body
        name: ProblemName
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Submission'
      security:
      - ApiKeyAuth: []
  /auth/callback:
    get:
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
  /auth/login:
    get:
      description: OAuth login endpoint
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
securityDefinitions:
  ApiKeyAuth:
    description: jwt=value, get it at /auth/login
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
