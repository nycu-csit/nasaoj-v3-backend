basePath: /
definitions:
  handlers.MeOutput:
    properties:
      isAdmin:
        type: boolean
      jwtClaim:
        $ref: '#/definitions/models.JWTClaim'
      resource:
        $ref: '#/definitions/models.UserResource'
    type: object
  handlers.ScoreOutput:
    properties:
      csId:
        type: string
      score:
        type: integer
      stages:
        additionalProperties:
          type: integer
        type: object
    type: object
  handlers.problemOutput:
    properties:
      name:
        type: string
      problemId:
        type: integer
      stages:
        additionalProperties:
          $ref: '#/definitions/handlers.problemOutputStage'
        type: object
    type: object
  handlers.problemOutputStage:
    properties:
      before:
        items:
          type: string
        type: array
      score:
        type: integer
      testcases:
        items:
          $ref: '#/definitions/handlers.problemOutputStageTestcase'
        type: array
    type: object
  handlers.problemOutputStageTestcase:
    properties:
      name:
        type: string
    type: object
  handlers.resultOutput:
    properties:
      csId:
        type: string
      id:
        type: integer
      jobs:
        items:
          $ref: '#/definitions/handlers.resultOutputJob'
        type: array
      pending:
        type: integer
      problemId:
        type: integer
      problemName:
        type: string
      score:
        type: integer
      submitAt:
        type: integer
    type: object
  handlers.resultOutputJob:
    properties:
      execAt:
        type: integer
      retCode:
        type: integer
      stageName:
        type: string
      testName:
        type: string
    type: object
  handlers.submitInput:
    properties:
      problemId:
        description: Submit problem ID
        type: integer
    type: object
  handlers.submitOutput:
    properties:
      csId:
        type: string
      id:
        type: integer
      problemId:
        type: integer
      problemName:
        type: string
      submitAt:
        type: integer
    type: object
  jwt.NumericDate:
    properties:
      time.Time:
        type: string
    type: object
  models.JWTClaim:
    properties:
      aud:
        description: the `aud` (Audience) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
        items:
          type: string
        type: array
      csId:
        type: string
      exp:
        type: integer
      groups:
        items:
          type: string
        type: array
      iat:
        type: integer
      iss:
        description: the `iss` (Issuer) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
        type: string
      jti:
        description: the `jti` (JWT ID) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.7
        type: string
      nbf:
        allOf:
        - $ref: '#/definitions/jwt.NumericDate'
        description: the `nbf` (Not Before) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.5
      sub:
        description: the `sub` (Subject) claim. See https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.2
        type: string
    type: object
  models.UserResource:
    properties:
      csId:
        type: string
      id:
        type: integer
    type: object
info:
  contact: {}
  license:
    name: WTFPL
  termsOfService: http://swagger.io/terms/
  title: NASAOJ v3
  version: "2.0"
paths:
  /api/admin/reloadscores:
    post:
      responses:
        "200":
          description: Success
          schema:
            type: string
        "401":
          description: Unauthorized
  /api/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeOutput'
        "401":
          description: missing credential
          schema:
            type: string
  /api/output:
    get:
      parameters:
      - description: Submission id
        in: query
        name: subId
        required: true
        type: number
      - description: Stage name
        in: query
        name: stage
        required: true
        type: string
      - description: Testcase name
        in: query
        name: testcase
        required: true
        type: string
      responses:
        "200":
          description: Testcase result output
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
  /api/problems:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.problemOutput'
            type: array
        "500":
          description: Problem loading error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
  /api/results:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Last submission to the problem
          schema:
            $ref: '#/definitions/handlers.resultOutput'
        "400":
          description: Problem ID invalid
          schema:
            type: string
        "401":
          description: User resource missing
          schema:
            type: string
        "404":
          description: No submission
          schema:
            type: string
  /api/scores:
    get:
      parameters:
      - description: Problem ID
        in: query
        name: problemId
        required: true
        type: integer
      responses:
        "200":
          description: Scores
          schema:
            items:
              $ref: '#/definitions/handlers.ScoreOutput'
            type: array
        "400":
          description: Invalid problem id
          schema:
            type: string
        "402":
          description: jwt claim missing
          schema:
            type: string
  /api/submit:
    put:
      consumes:
      - application/json
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.submitInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.submitOutput'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
  /auth/callback:
    get:
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
  /auth/login:
    get:
      description: OAuth login endpoint
      responses:
        "302":
          description: 302 Found
          schema:
            type: ""
securityDefinitions:
  ApiKeyAuth:
    description: jwt=value, get it at /auth/login
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
