---
name: timeout-score-subprocess
problemId: 21
description: |
  Test that score is not put when job times out
  Using Python subprocess
cooldown: 0
scoreType: self-managed
args:
  endpoint: http://backend:8080
preScript:
  scripts:
    - set -o errexit -o pipefail -o xtrace
stages:
  main:
    testcases:
      - name: timeout-put-score
        files:
          - timeout-put-score-sub.py.tmpl
        scripts:
          - python3 timeout-put-score-sub.py.tmpl
        timeout: 2
        gracePeriod: 2
    score: 0
