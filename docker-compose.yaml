---
services:
  pg:
    image: postgres:17.2
    environment:
      POSTGRES_USER: poop
      POSTGRES_PASSWORD: poop
      POSTGRES_DB: nasa
    ports:
      - 5432:5432
    volumes:
      - pg:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - 6379:6379
    restart: unless-stopped
  minio:
    image: bitnami/minio:2025.5.24-debian-12-r5
    environment:
      MINIO_ROOT_USER: poop
      MINIO_ROOT_PASSWORD: poop1145141919810
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/bitnami/minio/data
    restart: unless-stopped
  backend:
    build:
      context: .
      target: backend_runtime
    env_file:
      - path: ./backend/.env
    ports:
      - 8080:8080
      - 8081:8081
    volumes:
      # - '../problemset:/data'
      - './:/data'
    depends_on:
      - pg
      - minio
      - redis
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker_runtime
    env_file:
      - path: ./worker/.env
    depends_on:
      - backend
volumes:
  pg: {}
  minio: {}
