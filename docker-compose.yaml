---
services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: poop
    ports:
      - 5432:5432
    volumes:
      - ./docker/postgres/:/docker-entrypoint-initdb.d/
      - postgres:/var/lib/postgresql/data
    healthcheck:
      interval: 10s
      retries: 6
      test: 
        - CMD-SHELL
        - |
          echo '\d' | psql -v ON_ERROR_STOP=1 \
            postgres://nasaoj:nasaoj@postgres:5432/nasaoj?sslmode=disable
    restart: unless-stopped

  redis:
    image: library/redis:8.2.1-alpine3.22
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --raw incr ping
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ROOT_USER: poop
      MINIO_ROOT_PASSWORD: poop1145141919810
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/data
    healthcheck:
      test:
        - CMD-SHELL
        - mc ready local
    restart: unless-stopped

  clickhouse:
    image: library/clickhouse:25.7.4
    environment:
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_PASSWORD: uptrace
      CLICKHOUSE_DB: uptrace
    ports:
      - 8123:8123
      #- 9000:9000
    volumes:
      - clickhouse:/var/lib/clickhouse
    restart: unless-stopped

  uptrace:
    image: uptrace/uptrace:2.0.1
    ports:
      - 14317:14317
      - 14318:14318
    volumes:
      - ./docker/uptrace/config.yml:/etc/uptrace/config.yml
    depends_on:
      - postgres
      - clickhouse
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend_runtime
    env_file:
      - path: ./backend/.env
    ports:
      - 8080:8080
    volumes:
      # - '../problemset:/data'
      - './:/data'
    depends_on:
      - postgres
      - minio
      - redis
      - uptrace
    healthcheck:
      test:
        - CMD-SHELL
        - /judge migrate init
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker_runtime
    env_file:
      - path: ./worker/.env
    depends_on:
      - backend
volumes:
  redis: {}
  postgres: {}
  minio: {}
  clickhouse: {}
