---
services:
  pg:
    image: postgres:17.2
    environment:
      POSTGRES_USER: poop
      POSTGRES_PASSWORD: poop
      POSTGRES_DB: poop
    ports:
      - 5432:5432
    restart: unless-stopped
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - 6379:6379
    restart: unless-stopped
  minio:
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: poop
      MINIO_ROOT_PASSWORD: poop1145141919810
      MINIO_SCHEME: https
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/bitnami/minio/data
    restart: unless-stopped
  backend:
    build:
      context: .
      target: backend_runtime
    env_file:
      - path: ./backend/.env
    ports:
      - 8080:8080
      - 8081:8081
    volumes:
      - '../problemset/problems:/data/problems'
      - '../problemset/testcases:/data/testcases'
    depends_on:
      - pg
      - minio
      - redis
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker_runtime
    env_file:
      - path: ./worker/.env
    depends_on:
      - backend
volumes:
  minio: {}
