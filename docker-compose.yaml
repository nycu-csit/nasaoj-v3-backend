---
services:
  pg:
    image: postgres:17.2
    environment:
      POSTGRES_USER: poop
      POSTGRES_PASSWORD: poop
      POSTGRES_DB: poop
    ports:
      - 5432:5432
    restart: always
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - 6379:6379
    restart: always
  minio:
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: poop
      MINIO_ROOT_PASSWORD: poop1145141919810
      MINIO_SCHEME: https
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/bitnami/minio/data
    restart: always
