---
stages:
  - build
  - test
  - package
  - deploy

build:
  stage: build
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/golang/1.24.3:main
  cache:
    - key:
        files:
          - go.mod
          - go.sum
      paths:
        - /go/pkg/
  script:
    - CGO_ENABLED=0 go build -o judge
  artifacts:
    paths:
      - judge
    expire_in: 1 week

go-test:
  stage: test
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/golang/1.24.3:main
  script:
    - go test ./...

swag-test:
  stage: test
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/golang/1.24.3:main
  before_script:
    - go install github.com/swaggo/swag/cmd/swag@v1.16.4
  script:
    - SWAG=/go/bin/swag make swagger
    - |
      if ! git diff --exit-code; then
        echo "ERROR: /go/bin/swag command introduced uncommitted changes!"
        echo "Please commit the generated files or update your .gitignore."
        git status
        git diff
        exit 1 # Fail the job
      else
        echo "No uncommitted changes detected. OpenAPI is up-to-date."
      fi

variables:
  DOCKERFILE: "Dockerfile"
  KANIKO_CACHE_ARGS: ""
  KANIKO_ADDITIONAL_ARGS: ""
  NASA_REGISTRY: "nasaoj-v3.it.cs.nycu.edu.tw"

.kaniko:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  stage: package
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/utils/kaniko
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          },
          "$NASA_REGISTRY": {
            "username": "$REGISTRY_USER",
            "password": "$REGISTRY_PASS"
          }
        }
      }
      EOF
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        ADDITIONAL_DEST="--destination $NASA_REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG"
      fi
  script:
    - >-
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/$DOCKERFILE
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_NAME"
      --destination "$NASA_REGISTRY/$IMAGE_NAME:$CI_COMMIT_REF_NAME"
      $ADDITIONAL_DEST
      $KANIKO_CACHE_ARGS
      $KANIKO_ADDITIONAL_ARGS
  after_script:
    - rm /kaniko/.docker/config.json

package:worker:
  extends: .kaniko
  variables:
    IMAGE_NAME: worker
    KANIKO_ADDITIONAL_ARGS: '--target=worker_runtime'

package:backend:
  extends: .kaniko
  variables:
    IMAGE_NAME: backend
    KANIKO_ADDITIONAL_ARGS: '--target=backend_runtime'

.deploy:
  tags: [nasa]
  rules:
    - if: $CI_COMMIT_REF_NAME == $BRANCH
  stage: deploy
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/kubectl/3.21:main
  script:
    - >-
      kubectl rollout restart deployment backend
      --kubeconfig "$KUBECONFIG" --namespace "$NAMESPACE"
    - >-
      kubectl rollout restart deployment worker
      --kubeconfig "$KUBECONFIG" --namespace "$NAMESPACE"

deploy:alpha:
  extends: .deploy
  variables:
    BRANCH: main
    NAMESPACE: nasaoj-alpha

deploy:production:
  extends: .deploy
  variables:
    BRANCH: production
    NAMESPACE: nasaoj-prod
