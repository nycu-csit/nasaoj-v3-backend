---
include:
  - project: 'devops/templates'
    file: 'container/kaniko-build.gitlab-ci.yml'

variables:
  KANIKO_CACHE_ARGS: ''

stages:
  - package

package_worker:
  variables:
    IMAGE_NAME: worker
    DOCKERFILE: "dockerfiles/worker.Dockerfile"
  extends: .kaniko

package_backend:
  variables:
    IMAGE_NAME: backend
    DOCKERFILE: "dockerfiles/backend.Dockerfile"
  extends: .kaniko
