---
include:
  - project: 'devops/templates'
    file: 'container/kaniko-build.gitlab-ci.yml'

variables:
  KANIKO_CACHE_ARGS: ''

stages:
  - package-worker
  - package-backend

package-worker:
  variables:
    DOCKERFILE: "dockerfiles/worker.Dockerfile"
  extends: .kaniko

package-backend:
  variables:
    DOCKERFILE: "dockerfiles/backend.Dockerfile"
  extends: .kaniko
