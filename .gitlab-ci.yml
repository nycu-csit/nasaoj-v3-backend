---
variables:
  DOCKERFILE: "Dockerfile"
  KANIKO_CACHE_ARGS: "--cache=true --cache-copy-layers=true --cache-ttl=24h"
  KANIKO_ADDITIONAL_ARGS: ""
  NASA_REGISTRY: "nasaoj-v3.it.cs.nycu.edu.tw"

.kaniko:
  stage: package
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/utils/kaniko
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          },
          "$NASA_REGISTRY": {
            "username": "$REGISTRY_USER",
            "password": "$REGISTRY_PASS"
          }
        }
      }
      EOF
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        ADDITIONAL_DEST="--destination $NASA_REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG"
      fi
  script:
    - >-
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/$DOCKERFILE
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_NAME"
      --destination "$NASA_REGISTRY/$IMAGE_NAME:$CI_COMMIT_REF_NAME"
      $ADDITIONAL_DEST
      $KANIKO_CACHE_ARGS
      $KANIKO_ADDITIONAL_ARGS
  after_script:
    - rm /kaniko/.docker/config.json

stages:
  - package
  - test
  - deploy

package_worker:
  variables:
    IMAGE_NAME: worker
    KANIKO_ADDITIONAL_ARGS: '--target=worker_runtime'
  extends: .kaniko

package_backend:
  variables:
    IMAGE_NAME: backend
    KANIKO_ADDITIONAL_ARGS: '--target=backend_runtime'
  extends: .kaniko

go-test:
  stage: test
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/golang/1.24.3:main
  script:
    - go test ./...

swag-test:
  stage: test
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/golang/1.24.3:main
  before_script:
    - go install github.com/swaggo/swag/cmd/swag@latest
  script:
    - SWAG=/go/bin/swag make
    - |
      if ! git diff --exit-code; then
        echo "ERROR: /go/bin/swag command introduced uncommitted changes!"
        echo "Please commit the generated files or update your .gitignore."
        git status
        git diff
        exit 1 # Fail the job
      else
        echo "No uncommitted changes detected. OpenAPI is up-to-date."
      fi

deploy:
  tags: [nasa]
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
  stage: deploy
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/kubectl/3.21:main
  script:
    - >-
      kubectl rollout restart deployment backend
      --kubeconfig "$KUBECONFIG" --namespace nasaoj
