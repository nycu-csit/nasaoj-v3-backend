---
include:
  - project: 'devops/templates'
    file: 'container/kaniko-build.gitlab-ci.yml'

stages:
  - package

package_worker:
  variables:
    IMAGE_NAME: worker
    KANIKO_ADDITIONAL_ARGS: '--target=worker_runtime'
  extends: .kaniko

package_backend:
  variables:
    IMAGE_NAME: backend
    KANIKO_ADDITIONAL_ARGS: '--target=backend_runtime'
  extends: .kaniko
