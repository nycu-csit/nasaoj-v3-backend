---
variables:
  DOCKERFILE: "Dockerfile"
  KANIKO_CACHE_ARGS: ""
  KANIKO_ADDITIONAL_ARGS: ""
  NASA_REGISTRY: "nasaoj-v3.it.cs.nycu.edu.tw"

.kaniko:
  rules:
    - if: $CI_PIPELINE_SOURCE != "push"
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  stage: package
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/utils/kaniko
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          },
          "$NASA_REGISTRY": {
            "username": "$REGISTRY_USER",
            "password": "$REGISTRY_PASS"
          }
        }
      }
      EOF
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        ADDITIONAL_DEST="--destination $NASA_REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG"
      fi
  script:
    - >-
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/$DOCKERFILE
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_NAME"
      --destination "$NASA_REGISTRY/$IMAGE_NAME:$CI_COMMIT_REF_NAME"
      $ADDITIONAL_DEST
      $KANIKO_CACHE_ARGS
      $KANIKO_ADDITIONAL_ARGS
  after_script:
    - rm /kaniko/.docker/config.json

package:worker:
  extends: .kaniko
  variables:
    IMAGE_NAME: worker
    KANIKO_ADDITIONAL_ARGS: '--target=worker_runtime'

package:backend:
  extends: .kaniko
  variables:
    IMAGE_NAME: backend
    KANIKO_ADDITIONAL_ARGS: '--target=backend_runtime'
