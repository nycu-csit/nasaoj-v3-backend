---
.deploy:
  tags: [nasa]
  rules:
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "web"
      when: never
    - if: $CI_COMMIT_REF_NAME == $BRANCH
  stage: deploy
  image: dockersource.cc.cs.nctu.edu.tw/devops/images/kubectl/3.21:main
  script:
    - |
      while read -r ns; do
        kubectl rollout restart deployment/backend deployment/worker \
          --kubeconfig "$KUBECONFIG" --namespace "$ns"
      done <<< "$(tr '[:space:]' '\n' <<< "$NAMESPACE")"

deploy:alpha:
  extends: .deploy
  variables:
    BRANCH: main
    NAMESPACE: "nasaoj-alpha nnieoj-alpha"

deploy:production:
  extends: .deploy
  variables:
    BRANCH: production
    NAMESPACE: "nasaoj-prod nnieoj-prod"
